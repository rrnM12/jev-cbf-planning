[project]
name = "jev-cbf-planning"
version = "0.0.0"
description = "Inspectable experiments for Jev-selected CBF geometry, reusing FRAX"
requires-python = ">=3.12"
# Runtime requirements from the checked-out FRAX/CBFpy packages and OSCBF demo.
# The upstream packages themselves are imported from the read-only checkouts.
dependencies = [
    "elastiqp[jax]>=0.1.0",
    "jax>=0.9.1",
    "lxml",
    "mujoco>=3.3.1",
    "networkx",
    "numpy",
    "packaging",
    "pyyaml",
    "qpax",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.5"]

[project.scripts]
jev-cbf = "jev_cbf.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jev_cbf"
source-include = ["configs/**", "docs/**", "tests/**", "AGENTS.md", "ARCHITECTURE.md", "PROGRESS.md", "uv.lock"]
